<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Loading Debug</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; }
        .section { background: #f8f9fa; margin: 20px 0; padding: 20px; border-radius: 8px; }
        .success { color: #28a745; background: #d4edda; padding: 10px; border-radius: 5px; margin: 5px 0; }
        .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 5px; margin: 5px 0; }
        .info { color: #0c5460; background: #d1ecf1; padding: 10px; border-radius: 5px; margin: 5px 0; }
        .image-test { border: 2px solid #007bff; padding: 10px; margin: 10px 0; border-radius: 8px; }
        img { max-width: 300px; border: 1px solid #ddd; margin: 10px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin: 5px; }
        pre { background: #f1f1f1; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔍 Image Loading Debug Tool</h1>
    
    <div class="section">
        <h2>📊 Current Environment</h2>
        <div id="env-info"></div>
    </div>
    
    <div class="section">
        <h2>🌐 Server Tests</h2>
        <button onclick="testServerAccess()">Test Server Access</button>
        <div id="server-results"></div>
    </div>
    
    <div class="section">
        <h2>📋 Quiz JSON Test</h2>
        <button onclick="testQuizJSON()">Load Quiz JSON</button>
        <div id="json-results"></div>
    </div>
    
    <div class="section">
        <h2>🖼️ Image Path Tests</h2>
        <button onclick="testAllImagePaths()">Test All Image Paths</button>
        <div id="image-path-results"></div>
    </div>
    
    <div class="section">
        <h2>🎯 Visual Image Tests</h2>
        <div class="image-test">
            <h3>Test 1: Direct Relative Path</h3>
            <img src="data/images/genital_aciller/ga_1.png" alt="Test 1" 
                 onload="imageLoadSuccess(this, 'Test 1')" 
                 onerror="imageLoadFailed(this, 'Test 1')">
            <div id="test1-result">Loading...</div>
        </div>
        
        <div class="image-test">
            <h3>Test 2: Absolute Path</h3>
            <img src="/data/images/genital_aciller/ga_1.png" alt="Test 2" 
                 onload="imageLoadSuccess(this, 'Test 2')" 
                 onerror="imageLoadFailed(this, 'Test 2')">
            <div id="test2-result">Loading...</div>
        </div>
        
        <div class="image-test">
            <h3>Test 3: Full URL</h3>
            <img src="http://localhost:3000/data/images/genital_aciller/ga_1.png" alt="Test 3" 
                 onload="imageLoadSuccess(this, 'Test 3')" 
                 onerror="imageLoadFailed(this, 'Test 3')">
            <div id="test3-result">Loading...</div>
        </div>
        
        <div class="image-test">
            <h3>Test 4: Current Directory Path</h3>
            <img src="./data/images/genital_aciller/ga_1.png" alt="Test 4" 
                 onload="imageLoadSuccess(this, 'Test 4')" 
                 onerror="imageLoadFailed(this, 'Test 4')">
            <div id="test4-result">Loading...</div>
        </div>
    </div>
    
    <div class="section">
        <h2>🩺 Quiz Simulation</h2>
        <button onclick="simulateQuizImageLoad()">Simulate Quiz Image Loading</button>
        <div id="quiz-simulation"></div>
    </div>

    <script>
        // Display environment info
        function displayEnvironmentInfo() {
            const info = {
                'Current URL': window.location.href,
                'Origin': window.location.origin,
                'Protocol': window.location.protocol,
                'Host': window.location.host,
                'Pathname': window.location.pathname,
                'Base URI': document.baseURI,
                'User Agent': navigator.userAgent.substring(0, 100) + '...'
            };
            
            let html = '<div class="info">';
            for (const [key, value] of Object.entries(info)) {
                html += `<strong>${key}:</strong> ${value}<br>`;
            }
            html += '</div>';
            
            document.getElementById('env-info').innerHTML = html;
        }
        
        async function testServerAccess() {
            const resultsDiv = document.getElementById('server-results');
            resultsDiv.innerHTML = '<div class="info">Testing server access...</div>';
            
            const endpoints = [
                'http://localhost:3000/',
                'http://localhost:3000/data/images/genital_aciller/ga_1.png',
                'http://localhost:3000/data/quizzes/genital_aciller.json',
                'http://localhost:3000/quiz.html'
            ];
            
            let html = '<h3>Server Access Results:</h3>';
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint, { method: 'HEAD' });
                    if (response.ok) {
                        html += `<div class="success">✅ ${endpoint} - OK (${response.status})</div>`;
                    } else {
                        html += `<div class="error">❌ ${endpoint} - ${response.status} ${response.statusText}</div>`;
                    }
                } catch (error) {
                    html += `<div class="error">❌ ${endpoint} - ${error.message}</div>`;
                }
            }
            
            resultsDiv.innerHTML = html;
        }
        
        async function testQuizJSON() {
            const resultsDiv = document.getElementById('json-results');
            resultsDiv.innerHTML = '<div class="info">Loading quiz JSON...</div>';
            
            try {
                const response = await fetch('data/quizzes/genital_aciller.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const quizData = await response.json();
                
                // Find questions with images
                const questionsWithImages = quizData.questions.filter(q => q.image && q.image.url);
                
                let html = `
                    <div class="success">✅ Quiz JSON loaded successfully</div>
                    <div class="info">
                        <strong>Quiz ID:</strong> ${quizData.id}<br>
                        <strong>Title:</strong> ${quizData.title}<br>
                        <strong>Total Questions:</strong> ${quizData.questions.length}<br>
                        <strong>Questions with Images:</strong> ${questionsWithImages.length}
                    </div>
                `;
                
                if (questionsWithImages.length > 0) {
                    html += '<h4>Questions with Images:</h4>';
                    questionsWithImages.forEach((q, index) => {
                        html += `
                            <div class="info">
                                <strong>Question ${q.id}:</strong> ${q.question.substring(0, 100)}...<br>
                                <strong>Image URL:</strong> ${q.image.url}<br>
                                <strong>Image Alt:</strong> ${q.image.alt}<br>
                                <strong>Image Caption:</strong> ${q.image.caption}
                            </div>
                        `;
                    });
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Failed to load quiz JSON: ${error.message}</div>`;
            }
        }
        
        async function testAllImagePaths() {
            const resultsDiv = document.getElementById('image-path-results');
            resultsDiv.innerHTML = '<div class="info">Testing all possible image paths...</div>';
            
            const imagePaths = [
                'data/images/genital_aciller/ga_1.png',
                '/data/images/genital_aciller/ga_1.png',
                './data/images/genital_aciller/ga_1.png',
                '../data/images/genital_aciller/ga_1.png',
                'http://localhost:3000/data/images/genital_aciller/ga_1.png'
            ];
            
            let html = '<h3>Image Path Test Results:</h3>';
            
            for (const path of imagePaths) {
                try {
                    const response = await fetch(path, { method: 'HEAD' });
                    const contentType = response.headers.get('Content-Type');
                    const contentLength = response.headers.get('Content-Length');
                    
                    if (response.ok) {
                        html += `
                            <div class="success">
                                ✅ <strong>${path}</strong><br>
                                Status: ${response.status} | Type: ${contentType} | Size: ${contentLength} bytes
                            </div>
                        `;
                    } else {
                        html += `<div class="error">❌ ${path} - HTTP ${response.status}</div>`;
                    }
                } catch (error) {
                    html += `<div class="error">❌ ${path} - ${error.message}</div>`;
                }
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function imageLoadSuccess(img, testName) {
            const resultDiv = document.getElementById(`test${testName.split(' ')[1]}-result`);
            resultDiv.innerHTML = `<div class="success">✅ ${testName}: Image loaded successfully!</div>`;
            console.log(`${testName} success: ${img.src}`);
        }
        
        function imageLoadFailed(img, testName) {
            const resultDiv = document.getElementById(`test${testName.split(' ')[1]}-result`);
            resultDiv.innerHTML = `<div class="error">❌ ${testName}: Failed to load image</div>`;
            console.error(`${testName} failed: ${img.src}`);
        }
        
        async function simulateQuizImageLoad() {
            const resultsDiv = document.getElementById('quiz-simulation');
            resultsDiv.innerHTML = '<div class="info">Simulating quiz image loading process...</div>';
            
            try {
                // Step 1: Load quiz JSON (simulating quiz.js behavior)
                const response = await fetch('data/quizzes/genital_aciller.json');
                const quizData = await response.json();
                
                // Step 2: Find the question with image
                const questionWithImage = quizData.questions.find(q => q.image && q.image.url);
                
                if (!questionWithImage) {
                    resultsDiv.innerHTML = '<div class="error">❌ No question with image found</div>';
                    return;
                }
                
                // Step 3: Test the image URL as the quiz would use it
                const imageUrl = questionWithImage.image.url;
                
                let html = `
                    <div class="success">✅ Found question with image</div>
                    <div class="info">
                        <strong>Question:</strong> ${questionWithImage.question.substring(0, 100)}...<br>
                        <strong>Image URL from JSON:</strong> ${imageUrl}
                    </div>
                `;
                
                // Step 4: Test loading the image
                try {
                    const imgResponse = await fetch(imageUrl);
                    if (imgResponse.ok) {
                        html += '<div class="success">✅ Image URL is accessible via fetch</div>';
                        
                        // Step 5: Create an actual img element like the quiz does
                        const testImg = document.createElement('img');
                        testImg.style.maxWidth = '300px';
                        testImg.style.border = '2px solid green';
                        
                        testImg.onload = function() {
                            const successDiv = document.createElement('div');
                            successDiv.className = 'success';
                            successDiv.textContent = '✅ Image element loaded successfully! This should work in the quiz.';
                            resultsDiv.appendChild(successDiv);
                        };
                        
                        testImg.onerror = function() {
                            const errorDiv = document.createElement('div');
                            errorDiv.className = 'error';
                            errorDiv.textContent = '❌ Image element failed to load. This explains the quiz issue.';
                            resultsDiv.appendChild(errorDiv);
                        };
                        
                        testImg.src = imageUrl;
                        testImg.alt = questionWithImage.image.alt;
                        
                        html += '<h4>Testing Image Element (as quiz would create):</h4>';
                        
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = html;
                        tempDiv.appendChild(testImg);
                        
                        resultsDiv.innerHTML = '';
                        resultsDiv.appendChild(tempDiv);
                        
                    } else {
                        html += `<div class="error">❌ Image URL not accessible: ${imgResponse.status}</div>`;
                        resultsDiv.innerHTML = html;
                    }
                    
                } catch (error) {
                    html += `<div class="error">❌ Error loading image: ${error.message}</div>`;
                    resultsDiv.innerHTML = html;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Quiz simulation failed: ${error.message}</div>`;
            }
        }
        
        // Auto-run environment info on page load
        document.addEventListener('DOMContentLoaded', displayEnvironmentInfo);
    </script>
</body>
</html>
