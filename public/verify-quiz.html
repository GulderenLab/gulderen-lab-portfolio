<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genital Aciller Quiz - Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f2f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-color: #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-color: #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-color: #17a2b8;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border-color: #ffc107;
        }
        .quiz-preview {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .question-preview {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #218838;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        h2 {
            color: #495057;
            margin-top: 30px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🩺 Genital Aciller Quiz - Doğrulama Testi</h1>
        
        <div id="test-results"></div>
        
        <h2>📊 Test Sonuçları</h2>
        <div class="stats" id="stats"></div>
        
        <h2>🔗 Hızlı Erişim</h2>
        <a href="/radyoloji/sinav-olusturucu" class="btn btn-success">📝 Sınav Oluşturucu</a>
        <a href="quiz.html?quiz=genital-emergencies-quiz" class="btn">🎯 Direkt Quiz</a>
        <a href="quiz-hub.html" class="btn">🏠 Quiz Hub</a>
        <a href="data/quizzes/genital_aciller.json" class="btn" target="_blank">📄 JSON Data</a>
        
        <h2>📋 Quiz Önizleme</h2>
        <div id="quiz-preview"></div>
        
        <button onclick="runDetailedTests()" class="btn">🔄 Detaylı Test Çalıştır</button>
    </div>

    <script>
        let quizData = null;
        let testResults = [];

        async function runTests() {
            const resultsDiv = document.getElementById('test-results');
            const statsDiv = document.getElementById('stats');
            
            testResults = [];
            
            try {
                // Test 1: JSON file loading
                console.log('Testing JSON file loading...');
                await testJSONLoading();
                
                // Test 2: Quiz structure validation
                console.log('Testing quiz structure...');
                await testQuizStructure();
                
                // Test 3: Questions validation
                console.log('Testing questions...');
                await testQuestions();
                
                // Test 4: Exam creator compatibility
                console.log('Testing exam creator compatibility...');
                await testExamCreatorCompatibility();
                
            } catch (error) {
                testResults.push({
                    name: 'Kritik Hata',
                    status: 'error',
                    message: error.message
                });
            }
            
            // Display results
            resultsDiv.innerHTML = testResults.map(test => `
                <div class="status ${test.status}">
                    <strong>${test.name}:</strong> ${test.message}
                </div>
            `).join('');
            
            // Display stats
            const successCount = testResults.filter(t => t.status === 'success').length;
            const errorCount = testResults.filter(t => t.status === 'error').length;
            const warningCount = testResults.filter(t => t.status === 'warning').length;
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${testResults.length}</div>
                    <div class="stat-label">Toplam Test</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #28a745;">${successCount}</div>
                    <div class="stat-label">Başarılı</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #ffc107;">${warningCount}</div>
                    <div class="stat-label">Uyarı</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #dc3545;">${errorCount}</div>
                    <div class="stat-label">Hata</div>
                </div>
            `;
            
            // Preview quiz if loaded successfully
            if (quizData) {
                displayQuizPreview();
            }
        }
        
        async function testJSONLoading() {
            try {
                const response = await fetch('data/quizzes/genital_aciller.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                quizData = await response.json();
                testResults.push({
                    name: 'JSON Dosyası Yükleme',
                    status: 'success',
                    message: 'JSON dosyası başarıyla yüklendi'
                });
            } catch (error) {
                testResults.push({
                    name: 'JSON Dosyası Yükleme',
                    status: 'error',
                    message: `Hata: ${error.message}`
                });
                throw error;
            }
        }
        
        async function testQuizStructure() {
            const requiredFields = ['id', 'title', 'description', 'questions', 'category', 'difficulty'];
            const missingFields = requiredFields.filter(field => !quizData[field]);
            
            if (missingFields.length === 0) {
                testResults.push({
                    name: 'Quiz Yapısı',
                    status: 'success',
                    message: 'Tüm gerekli alanlar mevcut'
                });
            } else {
                testResults.push({
                    name: 'Quiz Yapısı',
                    status: 'error',
                    message: `Eksik alanlar: ${missingFields.join(', ')}`
                });
            }
            
            // Check ID format
            if (quizData.id && quizData.id.includes('genital-aciller')) {
                testResults.push({
                    name: 'Quiz ID',
                    status: 'success',
                    message: `ID doğru: ${quizData.id}`
                });
            } else {
                testResults.push({
                    name: 'Quiz ID',
                    status: 'warning',
                    message: `ID beklenmedik: ${quizData.id}`
                });
            }
        }
        
        async function testQuestions() {
            if (!quizData.questions || quizData.questions.length === 0) {
                testResults.push({
                    name: 'Sorular',
                    status: 'error',
                    message: 'Hiç soru bulunamadı'
                });
                return;
            }
            
            const questionCount = quizData.questions.length;
            testResults.push({
                name: 'Soru Sayısı',
                status: 'success',
                message: `${questionCount} soru bulundu`
            });
            
            // Check question structure
            let validQuestions = 0;
            let invalidQuestions = [];
            
            quizData.questions.forEach((q, index) => {
                const requiredFields = ['question', 'options', 'correctAnswer', 'explanation'];
                const hasAllFields = requiredFields.every(field => q[field] !== undefined);
                const hasValidOptions = Array.isArray(q.options) && q.options.length >= 2;
                const hasValidAnswer = typeof q.correctAnswer === 'number' && q.correctAnswer >= 0 && q.correctAnswer < q.options.length;
                
                if (hasAllFields && hasValidOptions && hasValidAnswer) {
                    validQuestions++;
                } else {
                    invalidQuestions.push(index + 1);
                }
            });
            
            if (invalidQuestions.length === 0) {
                testResults.push({
                    name: 'Soru Formatı',
                    status: 'success',
                    message: `Tüm ${validQuestions} soru doğru formatta`
                });
            } else {
                testResults.push({
                    name: 'Soru Formatı',
                    status: 'error',
                    message: `${invalidQuestions.length} soru hatalı: ${invalidQuestions.join(', ')}`
                });
            }
        }
        
        async function testExamCreatorCompatibility() {
            // Test if exam creator can load all quiz files including the new one
            const quizFiles = [
                'x-ray-physics-quiz.json',
                'ct-physics-quiz.json',
                'ultrasound-physics-quiz.json',
                'interventional-radiology-quiz.json',
                'thyroid-radiology-quiz-clean.json',
                'obgyn-radiology-quiz.json',
                'breast-radiology-quiz.json',
                'genital_aciller.json'
            ];
            
            let loadedQuizzes = 0;
            const failedQuizzes = [];
            
            for (const file of quizFiles) {
                try {
                    const response = await fetch(`data/quizzes/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.id && data.title && data.questions) {
                            loadedQuizzes++;
                        } else {
                            failedQuizzes.push(`${file} (yapı hatası)`);
                        }
                    } else {
                        failedQuizzes.push(`${file} (${response.status})`);
                    }
                } catch (error) {
                    failedQuizzes.push(`${file} (${error.message})`);
                }
            }
            
            if (failedQuizzes.length === 0) {
                testResults.push({
                    name: 'Sınav Oluşturucu Uyumluluğu',
                    status: 'success',
                    message: `Tüm ${loadedQuizzes} quiz başarıyla yüklendi`
                });
            } else {
                testResults.push({
                    name: 'Sınav Oluşturucu Uyumluluğu',
                    status: failedQuizzes.length < quizFiles.length ? 'warning' : 'error',
                    message: `${loadedQuizzes}/${quizFiles.length} quiz yüklendi. Sorunlu: ${failedQuizzes.join(', ')}`
                });
            }
        }
        
        function displayQuizPreview() {
            const previewDiv = document.getElementById('quiz-preview');
            
            if (quizData && quizData.questions) {
                const preview = `
                    <div class="quiz-preview">
                        <h3>${quizData.title}</h3>
                        <p><strong>Kategori:</strong> ${quizData.category}</p>
                        <p><strong>Zorluk:</strong> ${quizData.difficulty}</p>
                        <p><strong>Süre:</strong> ${quizData.timeLimit} dakika</p>
                        <p><strong>Geçme Notu:</strong> ${quizData.passingScore}%</p>
                        <p><strong>Açıklama:</strong> ${quizData.description}</p>
                        <p><strong>Toplam Soru:</strong> ${quizData.questions.length}</p>
                        
                        <h4>İlk 3 Soru Önizlemesi:</h4>
                        ${quizData.questions.slice(0, 3).map((q, index) => `
                            <div class="question-preview">
                                <p><strong>${index + 1}. ${q.question}</strong></p>
                                ${q.image ? `
                                    <div style="text-align: center; margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                                        <img src="${q.image.url}" alt="${q.image.alt}" style="max-width: 300px; max-height: 200px; border-radius: 5px; cursor: pointer;" onclick="window.open('${q.image.url}', '_blank')">
                                        <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">🖼️ ${q.image.caption}</p>
                                    </div>
                                ` : ''}
                                <ul>
                                    ${q.options.map((option, optIndex) => `
                                        <li style="${optIndex === q.correctAnswer ? 'color: green; font-weight: bold;' : ''}">${String.fromCharCode(65 + optIndex)}. ${option} ${optIndex === q.correctAnswer ? '✓' : ''}</li>
                                    `).join('')}
                                </ul>
                                <p><em>Açıklama: ${q.explanation}</em></p>
                            </div>
                        `).join('')}
                    </div>
                `;
                previewDiv.innerHTML = preview;
            }
        }
        
        function runDetailedTests() {
            console.clear();
            console.log('Running detailed tests...');
            runTests();
        }
        
        // Auto-run tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
