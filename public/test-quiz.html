<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Test - Genital Emergencies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .quiz-preview {
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
        }
        .question {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .option {
            margin: 5px 0;
            padding: 5px;
            background: #f1f1f1;
            border-radius: 3px;
        }
        .correct {
            background: #d4edda !important;
        }
    </style>
</head>
<body>
    <h1>🧪 Genital Emergencies Quiz - Test Sayfası</h1>
    
    <div class="test-section">
        <h2>📋 Test Özeti</h2>
        <p>Bu sayfa, genital emergencies quiz'inin entegrasyon testlerini yapar.</p>
        <ul>
            <li>JSON dosyasının yüklenmesi</li>
            <li>Quiz yapısının doğrulanması</li>
            <li>Soru formatlarının kontrolü</li>
            <li>Quiz hub bağlantısının test edilmesi</li>
        </ul>
    </div>

    <div class="test-section">
        <h2>🔧 Test Sonuçları</h2>
        <div id="test-results"></div>
        <button onclick="runTests()">Testleri Çalıştır</button>
        <button onclick="previewQuiz()">Quiz Önizleme</button>
        <button onclick="window.open('quiz.html?quiz=genital-emergencies-quiz', '_blank')">Canlı Quiz Testi</button>
        <button onclick="window.open('quiz-hub.html', '_blank')">Quiz Hub'ı Aç</button>
    </div>

    <div class="test-section">
        <h2>📊 Quiz Önizleme</h2>
        <div id="quiz-preview"></div>
    </div>

    <script>
        let quizData = null;

        async function runTests() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<p>Testler çalıştırılıyor...</p>';
            
            const tests = [];

            // Test 1: JSON dosyasının yüklenmesi
            try {
                const response = await fetch('data/quizzes/genital_aciller.json');
                if (response.ok) {
                    quizData = await response.json();
                    tests.push({
                        name: 'JSON Dosyası Yükleme',
                        status: 'success',
                        message: 'JSON dosyası başarıyla yüklendi'
                    });
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                tests.push({
                    name: 'JSON Dosyası Yükleme',
                    status: 'error',
                    message: `Hata: ${error.message}`
                });
            }

            // Test 2: Quiz yapısının kontrolü
            if (quizData) {
                const requiredFields = ['title', 'description', 'questions'];
                const missingFields = requiredFields.filter(field => !quizData[field]);
                
                if (missingFields.length === 0) {
                    tests.push({
                        name: 'Quiz Yapısı',
                        status: 'success',
                        message: 'Tüm gerekli alanlar mevcut'
                    });
                } else {
                    tests.push({
                        name: 'Quiz Yapısı',
                        status: 'error',
                        message: `Eksik alanlar: ${missingFields.join(', ')}`
                    });
                }

                // Test 3: Sorular kontrolü
                if (quizData.questions && quizData.questions.length > 0) {
                    const questionsValid = quizData.questions.every(q => 
                        q.question && q.options && q.correctAnswer !== undefined && q.explanation
                    );
                    
                    if (questionsValid) {
                        tests.push({
                            name: 'Soru Formatı',
                            status: 'success',
                            message: `${quizData.questions.length} soru doğru formatta`
                        });
                    } else {
                        tests.push({
                            name: 'Soru Formatı',
                            status: 'error',
                            message: 'Bazı sorularda eksik alanlar var'
                        });
                    }
                } else {
                    tests.push({
                        name: 'Soru Formatı',
                        status: 'error',
                        message: 'Hiç soru bulunamadı'
                    });
                }

                // Test 4: Cevap indeksleri kontrolü
                const invalidAnswers = quizData.questions?.filter(q => 
                    q.correctAnswer < 0 || q.correctAnswer >= q.options.length
                ) || [];
                
                if (invalidAnswers.length === 0) {
                    tests.push({
                        name: 'Cevap İndeksleri',
                        status: 'success',
                        message: 'Tüm cevap indeksleri geçerli'
                    });
                } else {
                    tests.push({
                        name: 'Cevap İndeksleri',
                        status: 'error',
                        message: `${invalidAnswers.length} soruda geçersiz cevap indeksi`
                    });
                }
            }

            // Test sonuçlarını görüntüle
            resultsDiv.innerHTML = tests.map(test => `
                <div class="test-result ${test.status}">
                    <strong>${test.name}:</strong> ${test.message}
                </div>
            `).join('');
        }

        async function previewQuiz() {
            if (!quizData) {
                await runTests();
            }
            
            const previewDiv = document.getElementById('quiz-preview');
            
            if (quizData && quizData.questions) {
                const preview = `
                    <h3>${quizData.title}</h3>
                    <p>${quizData.description}</p>
                    <p><strong>Toplam Soru:</strong> ${quizData.questions.length}</p>
                    
                    <h4>Örnek Sorular:</h4>
                    ${quizData.questions.slice(0, 3).map((q, index) => `
                        <div class="quiz-preview">
                            <div class="question">${index + 1}. ${q.question}</div>
                            ${q.options.map((option, optIndex) => `
                                <div class="option ${optIndex === q.correctAnswer ? 'correct' : ''}">
                                    ${String.fromCharCode(65 + optIndex)}. ${option}
                                    ${optIndex === q.correctAnswer ? ' ✓' : ''}
                                </div>
                            `).join('')}
                            <p><strong>Açıklama:</strong> ${q.explanation}</p>
                        </div>
                    `).join('')}
                `;
                previewDiv.innerHTML = preview;
            } else {
                previewDiv.innerHTML = '<p class="error">Quiz verileri yüklenemedi</p>';
            }
        }

        // Sayfa yüklendiğinde otomatik test çalıştır
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
